name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      # 仅配置临时 runner，避免 Windows 检出为 CRLF 后与项目 Prettier 的 LF 规则冲突。
      - name: Preserve LF checkout
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain preparation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
          "version=$((rustc --version) -replace ' ', '-')" >> $env:GITHUB_OUTPUT
      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            windows-cargo-${{ steps.rust.outputs.version }}-
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm dependency installation failed.' }
          python -m venv tests/.venv
          if ($LASTEXITCODE -ne 0) { throw 'Python environment preparation failed.' }
          & tests/.venv/Scripts/python.exe -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cargo dependency preparation failed.' }
      - name: Complete local checks
        run: ./scripts/check-release.ps1
